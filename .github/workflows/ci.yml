name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Git LFS datasets are NOT needed — tests use in-memory DataFrames
          lfs: false

      # -----------------------------------------------------------------------
      # 2. Python
      # -----------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # -----------------------------------------------------------------------
      # 3. Dependencies
      # -----------------------------------------------------------------------
      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install dev / test dependencies
        run: pip install -r requirements-dev.txt

      # -----------------------------------------------------------------------
      # 4. Cache PyThaiNLP data
      #    PyThaiNLP downloads its dictionary (~50 MB) on first tokenize call.
      #    Caching avoids re-downloading on every run.
      # -----------------------------------------------------------------------
      - name: Cache PyThaiNLP data
        uses: actions/cache@v4
        with:
          path: ~/pythainlp-data
          key: pythainlp-${{ runner.os }}-v1

      - name: Pre-download PyThaiNLP dictionaries
        run: |
          python -c "
          from pythainlp.tokenize import word_tokenize
          # Trigger the one-time download so it is cached for all test runs
          word_tokenize('สวัสดี', engine='newmm')
          print('PyThaiNLP data ready.')
          "

      # -----------------------------------------------------------------------
      # 5. Tests
      # -----------------------------------------------------------------------
      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --tb=short \
            --cov=src/thai_mod_api \
            --cov-report=term-missing \
            --cov-fail-under=70

      # -----------------------------------------------------------------------
      # 6. (Optional) Smoke check — only on push to main
      #    Starts the server, waits for it, and checks /api/health.
      #    Skipped on PRs and feature branches to keep CI fast.
      # -----------------------------------------------------------------------
      - name: Smoke check (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Start server in the background with a stub model bundle
          # (The server trains from scratch on first start when no cached model exists.
          #  In CI the datasets are not pulled via LFS, so this step is skipped
          #  unless lfs:true is set and datasets are available.)
          echo "Smoke check skipped: datasets not available in CI runner."
          echo "To run manually: uvicorn src.thai_mod_api.main:app --reload"
          echo "Then: curl -s http://127.0.0.1:8000/api/health"
